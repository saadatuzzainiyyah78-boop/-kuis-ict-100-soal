*{box-sizing:border-box}
:root{--blue:#3478f6;--blue2:#6ea8ff;--navy:#17345f;--sky:#eef6ff;--line:#dbe8f8;--muted:#6b7c93}

main{max-width:900px;margin:auto;padding:28px 15px}

.center{text-align:center;padding:55px 25px}

button{border:0;border-radius:15px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;transition:.18s ease;box-shadow:0 5px 14px rgba(39,91,155,.08)}

.sub{background:#eef5ff;color:#315b91}
.bar{height:10px;background:#e8f1fc;border-radius:99px;margin:13px 0 20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#75b1ff);border-radius:99px;transition:width .25s ease}
.meta{display:flex;justify-content:space-between;color:#3478f6;font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.5px}
.q{font-size:22px;font-weight:750;line-height:1.5;margin:22px 0 20px}
.opts{display:grid;gap:11px}
.opt{width:100%;text-align:left;border:2px solid var(--line);background:#fff;display:flex;gap:11px;align-items:flex-start;box-shadow:none}
.opt:hover{border-color:#a9c9f7;background:#f8fbff}
.opt.sel{border-color:var(--blue);background:#f0f6ff;box-shadow:0 5px 16px rgba(52,120,246,.10)}
.let{min-width:29px;height:29px;border-radius:9px;background:#eaf3ff;color:#3478f6;display:grid;place-items:center;font-weight:850}
.nav{display:flex;justify-content:space-between;margin-top:24px;gap:10px}
.stats{display:flex;gap:12px;justify-content:center;margin:22px 0}
.stat{background:#f4f8fd;border:1px solid #e3edf9;border-radius:17px;padding:15px;text-align:center;min-width:105px}
.stat b{display:block;font-size:25px;color:#3478f6}
.review{text-align:left;margin-top:28px}
.wrong{border-left:5px solid #e45b64;padding:14px;background:#fff8f8;border-radius:13px;margin:10px 0}
.good{color:#268a68}
.visual{margin:10px 0 18px;padding:14px;border:1px solid #dce9f8;border-radius:17px;background:#f7fbff;text-align:center}
.visual small{display:block;margin-top:8px;color:var(--muted)}
.toolbar,.browser,.search,.ppt{display:flex;gap:12px;align-items:center;justify-content:center;padding:12px;border-radius:11px;background:#fff;border:1px solid #dce8f7}
.toolbar span{padding:5px 9px;border:1px solid #e1eaf6;border-radius:7px}
.browser{justify-content:space-between;font-size:13px}
.search{max-width:420px;margin:auto;border-radius:30px;justify-content:flex-start;color:#60738c}
.visual table{margin:auto;border-collapse:collapse;background:#fff}
.visual th,.visual td{border:1px solid #cfdeef;padding:9px 18px}
.slides span{display:inline-block;padding:12px 18px;border:1px solid #cbdced;border-radius:9px}
.slides .active{font-weight:800;border-width:2px;border-color:#3478f6}
.cellgrid{display:grid;grid-template-columns:35px repeat(3,60px);justify-content:center}
.cellgrid>*{padding:8px;border:1px solid #d2e0ef}
.cellgrid em{font-style:normal;background:#fff}
.chart{height:100px;display:flex;align-items:end;justify-content:center;gap:12px}
.chart i{display:block;width:35px;background:#9fc7ff;border:1px solid #70a9f4;border-radius:5px 5px 0 0}
@media(max-width:600px){.q{font-size:19px}.stats{flex-direction:column}.card{padding:21px}.center{padding:40px 20px}}
