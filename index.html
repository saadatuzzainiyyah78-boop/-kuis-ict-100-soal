uan tinggi", "komersial", "pemerintah", "telekomunikasi"], "a": 0, "e": "Modul menjelaskan ac.id sebagai domain akademik/universitas."}, {"cat": "Word", "q": "Untuk menambahkan Header atau Footer digunakan tab ...", "o": ["Insert", "Data", "Formulas", "Slide Show"], "a": 0, "e": "Modul menjelaskan Insert → Header & Footer → Header/Footer."}, {"cat": "Word", "q": "Quick Access Toolbar di Word secara default menyediakan ...", "o": ["Save, Undo, dan Repeat", "Print, Chart, dan Formula", "Zoom, Slide Show, dan Audio", "Mail, Browser, dan Search"], "a": 0, "e": "Modul menyebut Save, Undo, dan Repeat sebagai tombol default Quick Access."}, {"cat": "Komputer", "q": "Manakah yang merupakan contoh sistem operasi yang disebutkan dalam modul?", "o": ["Windows", "Microsoft Word", "Google Chrome", "PowerPoint"], "a": 0, "e": "Modul memberi contoh sistem operasi seperti Windows, Linux, dan Apple."}, {"cat": "PowerPoint", "q": "SmartArt biasanya digunakan untuk membuat ...", "o": ["alur proses atau struktur organisasi", "nomor halaman", "rumus matematika saja", "email"], "a": 0, "e": "Modul menyebut SmartArt biasa digunakan untuk alur proses atau struktur organisasi."}, {"cat": "Internet", "q": "Menurut modul, kapasitas gratis Google Drive yang disebutkan adalah ...", "o": ["15 GB", "5 GB", "50 GB", "100 GB"], "a": 0, "e": "Modul menyebut kapasitas gratis Google Drive sebesar 15 GB."}, {"cat": "Word", "q": "Untuk membuat format nomor halaman berbeda antarbagian dokumen, modul menggunakan ...", "o": ["Section Break/Next Page dan Link to Previous", "WordArt saja", "Zoom saja", "Print Preview saja"], "a": 0, "e": "Modul menjelaskan Page Layout → Breaks → Next Page lalu memutus Link to Previous."}, {"cat": "Komputer", "q": "Perangkat yang disebut sebagai 'otaknya komputer' dalam modul adalah ...", "o": ["Processor", "Monitor", "Keyboard", "Printer"], "a": 0, "e": "Processor merupakan unit pemroses dan dalam modul disebut sebagai otaknya komputer."}, {"cat": "PowerPoint", "q": "Untuk m b menggunakan angka."}];
// Acak pilihan jawaban sekali saat halaman dimuat, sambil menjaga kunci jawaban tetap benar.
questions.forEach(q => {
  const correctText = q.o[q.a];
  for (let i = q.o.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [q.o[i], q.o[j]] = [q.o[j], q.o[i]];
  }
  q.a = q.o.indexOf(correctText);
});

let current=0, answers=Array(questions.length).fill(null);

function startQuiz(){document.getElementById('start').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');current=0;answers=Array(questions.length).fill(null);render();}
function render(){
 const q=questions[current];
 document.getElementById('qnum').textContent=`Soal ${current+1} / ${questions.length}`;
 document.getElementById('answered').textContent=`Terjawab ${answers.filter(x=>x!==null).length}`;
 document.getElementById('cat').textContent=q.cat;
 document.getElementById('pct').textContent=Math.round(((current+1)/questions.length)*100)+'%';
 document.getElementById('progress').style.width=((current+1)/questions.length*100)+'%';
 document.getElementById('question').textContent=q.q;
 const letters=['A','B','C','D'];
 document.getElementById('options').innerHTML=q.o.map((x,i)=>`<button class="option ${answers[current]===i?'selected':''}" onclick="choose(${i})"><span class="letter">${letters[i]}</span><span>${x}</span></button>`).join('');
 document.getElementById('prev').disabled=current===0;
 const next=document.getElementById('next'); next.textContent=current===questions.length-1?'Selesai ✓':'Berikutnya →';
}
function choose(i){answers[current]=i;render();}
function prevQ(){if(current>0){current--;render();}}
function nextQ(){
 if(answers[current]===null){alert('Pilih salah satu jawaban dulu yaa 😊');return;}
 if(current<questions.length-1){current++;render();}else finish();
}
function finish(){
 let correct=answers.reduce((n,a,i)=>n+(a===questions[i].a?1:0),0);
 document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
 document.getElementById('score').textContent=correct;
 document.getElementById('correct').textContent=correct;
 document.getElementById('wrong').textContent=questions.length-correct;
 document.getElementById('percent').textContent=correct+'%';
 document.getElementById('scoreText').textContent=correct>=85?'Gokil! Penguasaan ICT-mu mantap banget 🔥':correct>=70?'Bagus! Tinggal poles beberapa bagian lagi 💪':'Santaiii, justru sekarang kamu tahu bagian mana yang perlu dipelajari lagi 🌱';
}
function showReview(){
 const letters=['A','B','C','D'];
 const review=document.getElementById('review');review.classList.remove('hidden');
 review.innerHTML='<h3>📖 Pembahasan</h3><p style="color:#6b7b75">Pembahasan ditampilkan untuk semua soal. Soal yang kamu jawab salah ditandai merah.</p>'+
 questions.map((q,i)=>{
  const ok=answers[i]===q.a;
  return `<div class="review-item ${ok?'correct':'wrong'}"><div class="review-q">${i+1}. ${q.q}</div>
  <div class="ans ${ok?'righttxt':'wrongtxt'}">Jawabanmu: ${answers[i]===null?'Tidak dijawab':letters[answers[i]]+'. '+q.o[answers[i]]}</div>
  <div class="ans righttxt">Jawaban benar: ${letters[q.a]}. ${q.o[q.a]}</div>
  <div class="explain">💡 ${q.e}</div></div>`;
 }).join('');
 review.scrollIntoView({behavior:'smooth'});
}
function restart(){document.getElementById('result').classList.add('hidden');document.getElementById('start').classList.remove('hidden');document.getElementById('review').classList.add('hidden');}
